services:
  ollama:
    image: ollama/ollama:latest
    container_name: local-llm
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: ai-assistant-backend
    env_file:
      - .env
    environment:
      - LOCAL_LLM_URL=http://ollama:11434
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL}
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      - ollama
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped

volumes:
  ollama-data:
