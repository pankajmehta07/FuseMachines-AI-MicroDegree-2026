services:
  ollama:
    image: ollama/ollama:latest
    container_name: local-llm
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: ai-assistant-backend
    env_file:
      - .env
    environment:
      - LOCAL_LLM_URL=http://ollama:11434
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      - ollama
    volumes:
      - ./backend/app:/app/app
      - chroma-data:/app/chroma_data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: ai-assistant-frontend
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    restart: unless-stopped

volumes:
  ollama-data:
  chroma-data:
